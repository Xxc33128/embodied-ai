<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img"><title>HomeBody：VLM直接选择技能，几何、AMO和PD分别执行</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6d8190"/></marker></defs>
<rect width="940" height="460" rx="16" fill="#f5f8f8"/>
<style>text{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#203642;font-size:16px}.sub{fill:#637785;font-size:13px}.label{font-weight:600}</style>
<rect x="30" y="35" width="260" height="90" rx="9" fill="white" stroke="#cedadc"/>
<text x="160.0" y="63" class="label" text-anchor="middle">观测／任务／记忆</text>
<text x="160.0" y="86" class="sub" text-anchor="middle">RGB、深度、地图、历史</text>
<rect x="380" y="35" width="260" height="90" rx="9" fill="#e1eeee" stroke="#7ca7ad"/>
<text x="510.0" y="63" class="label" text-anchor="middle">VLM 决策</text>
<text x="510.0" y="86" class="sub" text-anchor="middle">当前技能＋目标参数</text>
<polyline points="290,80 380,80" fill="none" stroke="#6d8190" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="380" y="170" width="260" height="75" rx="9" fill="white" stroke="#cedadc"/>
<text x="510.0" y="198" class="label" text-anchor="middle">技能与结果契约</text>
<text x="510.0" y="221" class="sub" text-anchor="middle">navigate／pick／place／done</text>
<polyline points="510,125 510,170" fill="none" stroke="#6d8190" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="35" y="290" width="240" height="75" rx="9" fill="white" stroke="#cedadc"/>
<text x="155.0" y="318" class="label" text-anchor="middle">行走</text>
<text x="155.0" y="341" class="sub" text-anchor="middle">几何导航 → AMO 50 Hz</text>
<rect x="350" y="290" width="240" height="75" rx="9" fill="white" stroke="#cedadc"/>
<text x="470.0" y="318" class="label" text-anchor="middle">手臂</text>
<text x="470.0" y="341" class="sub" text-anchor="middle">几何／IK → 伺服 25 Hz</text>
<rect x="665" y="290" width="240" height="75" rx="9" fill="white" stroke="#cedadc"/>
<text x="785.0" y="318" class="label" text-anchor="middle">手指</text>
<text x="785.0" y="341" class="sub" text-anchor="middle">闭合度 → 标定位置</text>
<polyline points="510,245 510,265 155,265 155,290" fill="none" stroke="#6d8190" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="510,245 510,265 470,265 470,290" fill="none" stroke="#6d8190" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="510,245 510,265 785,265 785,290" fill="none" stroke="#6d8190" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="470" y="407" class="label" text-anchor="middle">控制参考 250 Hz · PD 与 MuJoCo 积分 1000 Hz</text>
<text x="470" y="435" class="sub" text-anchor="middle">以上为仿真配置周期；模型等待期间 heartbeat 维持物理与站立</text>
<polyline points="640,205 910,205 910,80 640,80" fill="none" stroke="#6d8190" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="777" y="193" class="sub" text-anchor="middle">技能反馈</text>
</svg>